<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR スケッチ</title>
<!-- ?v=xr で WebXR 版へ、?v=sensor でカメラ+センサー版へ、すぐ移動 -->
<style>
  html, body { margin: 0; background: #10151b; color: #f2f5f8;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 18px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.25rem; margin: 0 0 6px; }
  a.btn { display: flex; flex-direction: column; gap: 4px; padding: 18px 16px; border-radius: 8px; text-decoration: none;
    background: rgba(255,255,255,0.12); color: #f2f5f8; border: 1px solid rgba(255,255,255,0.25);
    font-weight: 700; font-size: 1.05rem; }
  a.btn small { font-weight: 400; color: #b9c4cf; font-size: 0.8rem; }
  a.btn .tag { align-self: flex-start; background: #0b1118; color: #6fb1ff; border-radius: 4px; padding: 1px 8px;
    font-size: 0.75rem; margin-bottom: 2px; }
  a.btn.rec { background: #6fb1ff; color: #0b1118; border-color: #6fb1ff; }
  a.btn.rec small { color: #1b2a3a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>AR スケッチ</h1>
  <a id="btnXr" class="btn" href="android/">
    <span class="tag" hidden>おすすめ</span>
    WebXR 版
    <small>Android(ARCore)</small>
  </a>
  <a id="btnSensor" class="btn" href="index.html">
    <span class="tag" hidden>おすすめ</span>
    カメラ+センサー版
    <small>iPhone など</small>
  </a>
</main>
<script>
(async function () {
  const v = new URLSearchParams(location.search).get("v");
  if (v === "xr") { location.replace("android/"); return; }
  if (v === "sensor") { location.replace("index.html"); return; }
  let ok = false;
  try { ok = !!(window.isSecureContext && navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")); }
  catch (e) { ok = false; }
  const rec = document.getElementById(ok ? "btnXr" : "btnSensor");
  rec.classList.add("rec");
  rec.querySelector(".tag").hidden = false;
})();
</script>
</body>
</html>
