<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR スケッチ 入口</title>
<!--
  入口のページ。端末を調べて、合うほうへ自動で移動する。
    WebXR の AR が使える(Android Chrome + ARCore など) → android/   (WebXR 版)
    使えない(iPhone など)                                → index.html (カメラ+センサー版)
  URL の末尾で、判定を使わずに指定もできる:
    start.html?v=xr      → WebXR 版へ
    start.html?v=sensor  → カメラ+センサー版へ
  自動で移動しないとき用に、リンクも出しておく。
-->
<style>
  html, body { margin: 0; background: #10151b; color: #f2f5f8;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.25rem; margin: 0; }
  p { margin: 0; line-height: 1.7; color: #b9c4cf; font-size: 0.92rem; }
  a.btn { display: block; padding: 14px; border-radius: 8px; background: #6fb1ff; color: #0b1118;
    font-weight: 700; text-align: center; text-decoration: none; }
  a.btn.sub { background: rgba(255,255,255,0.12); color: #f2f5f8; border: 1px solid rgba(255,255,255,0.25); }
  #status { padding: 10px 12px; border-radius: 6px; background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
<main>
  <h1>AR スケッチ</h1>
  <p id="status">お使いの端末を確認しています…</p>
  <a class="btn" href="android/">WebXR 版を開く(Android / ARCore 対応のChrome)</a>
  <a class="btn sub" href="index.html">カメラ+センサー版を開く(iPhone など)</a>
  <p>自動で移動しない場合は、上のどちらかを選んでください。</p>
</main>
<script>
(async function () {
  const status = document.getElementById("status");
  const q = new URLSearchParams(location.search).get("v");
  let to = null, why = "";
  if (q === "xr") { to = "android/"; why = "WebXR 版を開きます。"; }
  else if (q === "sensor") { to = "index.html"; why = "カメラ+センサー版を開きます。"; }
  else {
    let ok = false;
    try { ok = !!(window.isSecureContext && navigator.xr && await navigator.xr.isSessionSupported("immersive-ar")); }
    catch (e) { ok = false; }
    to = ok ? "android/" : "index.html";
    why = ok ? "WebXR の AR が使える端末です。WebXR 版を開きます。"
             : "WebXR の AR が使えない端末です。カメラ+センサー版を開きます。";
  }
  status.textContent = why;
  setTimeout(function () { location.replace(to); }, 900);
})();
</script>
</body>
</html>
