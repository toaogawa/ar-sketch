<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ar-sketch WebXR版 (Android)</title>
<!--
  ar-sketch WebXR版(段階1)
  - Android + Chrome(ARCore対応端末)専用。HTTPSで開くこと(GitHub Pagesなら可)。
  - 元の index.html とは別ファイル。iPhoneでは動かない(Safari は WebXR 非対応)。
  - 位置と向きは ARCore が出す値を使う(歩数推定やジャイロの自前計算はしない)。
  - 段階1の内容:
      1) スタート地点を決める(進む方向を向いて押す)
      2) その先に、コマが「歩く線の横の壁」に沿って並ぶ(ストーリーモードの考え方を引き継ぎ)
      3) 近づくとフェードイン
      4) 画像はファイル名順(AR開始前に選ぶ)。選ばなければ番号入りの仮コマ
      5) ずれ測定: A地点を記録 → 歩いて戻る → Aとの水平距離をcmで表示
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, "Noto Sans JP", sans-serif; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 4px 0; line-height: 1.5; font-size: 14px; }
  .note { color: #aaa; font-size: 12px; }
  .warn { color: #ffb74d; }
  .ok { color: #81c784; }
  button { font: inherit; font-size: 15px; padding: 12px 14px; border: 0; border-radius: 10px; background: #2d6cdf; color: #fff; }
  button.sub { background: #444; }
  button.on { background: #2d6cdf; }
  button:disabled { opacity: .4; }
  .big { width: 100%; font-size: 18px; padding: 16px; }
  input[type=file] { width: 100%; padding: 8px 0; color: #ddd; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > button { flex: 1 1 40%; }
  #settings { background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px; }
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; font-size: 13px; }
  .srow input[type=range] { grid-column: 1 / 3; width: 100%; }
  .srow .val { color: #9ecbff; font-variant-numeric: tabular-nums; }
  .nrow { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 13px; }
  .nrow label { flex: 1; }
  .nrow input[type=number] { width: 92px; font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; text-align: right; }
  .ar-only, #spacer { display: none; }
  #status { background: rgba(0,0,0,.6); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.6; }

  /* AR中: 背景を透明にしてカメラ映像を見せる */
  #overlay.in-ar { background: transparent; overflow: hidden; pointer-events: none; }
  #overlay.in-ar > * { pointer-events: auto; }
  #overlay.in-ar #pre { display: none; }
  #overlay.in-ar .ar-only { display: block; }
  #overlay.in-ar #spacer { display: block; flex: 1; pointer-events: none; }
  #overlay.in-ar #settings { display: none; }
  #overlay.in-ar #settings.open { display: block; max-height: 45vh; overflow: auto; background: rgba(0,0,0,.7); }
  #overlay.in-ar #hudBottom .row > button { background: rgba(45,108,223,.92); }
  #overlay.in-ar #hudBottom .row > button.sub { background: rgba(60,60,60,.92); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="overlay">
  <section id="pre">
    <h1>ar-sketch WebXR版(Android)</h1>
    <p id="support" class="note">対応を確認中…</p>
    <p class="note">① 画像を選ぶ(ファイル名順に並びます。選ばなければ番号入りの仮コマ)<br>
      ② 下の設定を必要なら調整<br>
      ③「AR開始」→ 歩く方向を向いて「ここをスタート地点にする」</p>
    <input id="files" type="file" accept="image/*" multiple>
    <p id="fileInfo" class="note">画像: 未選択(仮コマを使用)</p>
    <button id="btnAR" class="big" disabled>AR開始</button>
  </section>

  <section id="hudTop" class="ar-only">
    <div id="status">起動中…</div>
  </section>

  <div id="spacer"></div>

  <section id="settings">
    <h2>設定</h2>
    <div id="sliders"></div>
    <div class="row" id="sideRow">
      <button id="sideRight" class="sub">壁は右側</button>
      <button id="sideLeft" class="sub">壁は左側</button>
    </div>
    <div class="nrow">
      <label for="markerSize">マーカーの1辺の長さ</label>
      <input id="markerSize" type="number" inputmode="decimal" min="1" max="100" step="0.1">
      <span>cm</span>
    </div>
    <p class="note">マーカーは、黒い枠の外側ではなく「黒い正方形の1辺」を定規で測った長さを入れてください。マーカーの補正を入れたときに使います(今はまだ使われません)。</p>
    <p class="note">設定は自動で保存されます。AR中も「設定」ボタンで開いて調整できます。</p>
  </section>

  <section id="hudBottom" class="ar-only">
    <div class="row">
      <button id="btnStart" style="flex-basis:100%">ここをスタート地点にする(進む方向を向いて)</button>
      <button id="btnMarkA" class="sub">A地点を記録</button>
      <button id="btnClearA" class="sub">Aを消す</button>
      <button id="btnSettings" class="sub">設定</button>
      <button id="btnEnd" class="sub">終了</button>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';

// ------------------------------------------------------------
// 設定(初期値は、参考にしたQuest向けARコミックの配置値をもとにした値)
// ------------------------------------------------------------
const KEY = 'arsketch_webxr_settings_v1';
const DEFAULTS = {
  first: 2.0,    // スタート地点から最初のコマまでの距離(m)
  gap: 1.5,      // コマの間隔(m)
  lateral: 1.0,  // 歩く線から壁までの横距離(m)
  side: 'right', // 壁の側
  height: 1.0,   // コマの中心の高さ(床から, m)
  eyeH: 1.4,     // スタートボタンを押したときの目の高さ(m)
  width: 0.44,   // コマの幅(m)
  trigger: 2.5,  // この距離まで近づくと表示される(m)
  count: 6,      // 画像がないときの仮コマ数
  markerSize: 10 // マーカーの1辺の長さ(cm)。マーカー補正で使う(今は未使用)
};
const SLIDERS = [
  { k: 'first',   label: '最初のコマまでの距離', min: 0.5, max: 6,   step: 0.1,  unit: 'm' },
  { k: 'gap',     label: 'コマの間隔',           min: 0.5, max: 4,   step: 0.1,  unit: 'm' },
  { k: 'lateral', label: '歩く線から壁までの横距離', min: 0.3, max: 3, step: 0.1,  unit: 'm' },
  { k: 'height',  label: 'コマの中心の高さ(床から)', min: 0.3, max: 2.0, step: 0.05, unit: 'm' },
  { k: 'eyeH',    label: 'スタート時の目の高さ', min: 1.0, max: 1.9, step: 0.05, unit: 'm' },
  { k: 'width',   label: 'コマの幅',             min: 0.2, max: 1.5, step: 0.02, unit: 'm' },
  { k: 'trigger', label: '表示し始める距離',     min: 1,   max: 6,   step: 0.1,  unit: 'm' },
  { k: 'count',   label: '仮コマの数(画像なしのとき)', min: 1, max: 20, step: 1,   unit: '枚' }
];

let st = { ...DEFAULTS };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) st = { ...DEFAULTS, ...s };
} catch (e) { /* 保存できない環境でも動く */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const overlay = $('overlay');

// ------------------------------------------------------------
// three.js の準備
// ------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
Object.assign(renderer.domElement.style, {
  position: 'fixed', left: '0', top: '0', width: '1px', height: '1px',
  opacity: '0', pointerEvents: 'none'
});
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
const group = new THREE.Group();
scene.add(group);

// ------------------------------------------------------------
// 画像と仮コマ
// ------------------------------------------------------------
let images = [];   // { tex, aspect, name }  aspect = 高さ/幅
let panels = [];   // { mesh, aspect }
const placeholderCache = new Map();

function makePlaceholder(n) {
  if (placeholderCache.has(n)) return placeholderCache.get(n);
  const c = document.createElement('canvas');
  c.width = 512; c.height = 724;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 724);
  g.strokeStyle = '#000000'; g.lineWidth = 10; g.strokeRect(5, 5, 502, 714);
  g.fillStyle = '#000000';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 280px sans-serif'; g.fillText(String(n), 256, 330);
  g.font = '36px sans-serif'; g.fillText('ar-sketch WebXR', 256, 600);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const item = { tex, aspect: 724 / 512, name: 'placeholder-' + n };
  placeholderCache.set(n, item);
  return item;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 2048; // スマホのメモリ対策で縮小
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * sc));
      c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      resolve({ tex, aspect: c.height / c.width, name: file.name });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
    img.src = url;
  });
}

$('files').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const info = $('fileInfo');
  images.forEach((it) => it.tex.dispose());
  images = [];
  if (!files.length) {
    info.textContent = '画像: 未選択(仮コマを使用)';
    buildPanels();
    return;
  }
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  info.textContent = '読み込み中…';
  try {
    images = await Promise.all(files.map(loadImage));
    info.innerHTML = '<span class="ok">画像 ' + images.length + ' 枚</span>(' +
      images.map((it) => it.name).join(' → ') + ')';
  } catch (err) {
    images = [];
    info.innerHTML = '<span class="warn">読み込めない画像があります: ' + err.message + '</span>';
  }
  buildPanels();
});

// ------------------------------------------------------------
// コマの生成と配置
// ------------------------------------------------------------
let start = null; // { p0, fwd, right }  スタート地点の位置と、進む方向・右方向(水平)

function buildPanels() {
  panels.forEach((p) => { group.remove(p.mesh); p.mesh.material.dispose(); p.mesh.geometry.dispose(); });
  panels = [];
  const items = images.length
    ? images
    : Array.from({ length: st.count }, (_, i) => makePlaceholder(i + 1));
  items.forEach((it) => {
    const mat = new THREE.MeshBasicMaterial({
      map: it.tex, transparent: true, opacity: 0, side: THREE.DoubleSide, toneMapped: false
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.visible = false;
    group.add(mesh);
    panels.push({ mesh, aspect: it.aspect });
  });
  layout();
}

function layout() {
  group.visible = !!start;
  if (!start) return;
  const sign = st.side === 'right' ? 1 : -1;
  panels.forEach((p, i) => {
    const s = st.first + i * st.gap;
    p.mesh.position.copy(start.p0)
      .addScaledVector(start.fwd, s)
      .addScaledVector(start.right, st.lateral * sign);
    p.mesh.position.y = start.p0.y - st.eyeH + st.height;
    p.mesh.scale.set(st.width, st.width * p.aspect, 1);
    // 壁から通路の中心に向けて表示する
    const target = p.mesh.position.clone().addScaledVector(start.right, -sign);
    p.mesh.lookAt(target);
  });
}

// ------------------------------------------------------------
// 設定UI
// ------------------------------------------------------------
function fmt(def, v) {
  const digits = def.step >= 1 ? 0 : (def.step >= 0.1 ? 1 : 2);
  return Number(v).toFixed(digits) + ' ' + def.unit;
}
SLIDERS.forEach((def) => {
  const row = document.createElement('div');
  row.className = 'srow';
  row.innerHTML = '<span>' + def.label + '</span><span class="val"></span>' +
    '<input type="range" min="' + def.min + '" max="' + def.max + '" step="' + def.step + '">';
  const input = row.querySelector('input');
  const val = row.querySelector('.val');
  input.value = st[def.k];
  val.textContent = fmt(def, st[def.k]);
  input.addEventListener('input', () => {
    st[def.k] = Number(input.value);
    val.textContent = fmt(def, st[def.k]);
    save();
    if (def.k === 'count') buildPanels(); else layout();
  });
  $('sliders').appendChild(row);
});
function refreshSide() {
  $('sideRight').className = st.side === 'right' ? 'on' : 'sub';
  $('sideLeft').className = st.side === 'left' ? 'on' : 'sub';
}
$('sideRight').onclick = () => { st.side = 'right'; save(); refreshSide(); layout(); };
$('sideLeft').onclick = () => { st.side = 'left'; save(); refreshSide(); layout(); };
refreshSide();

// マーカーの1辺の長さ(cm)。空欄や範囲外の値は保存しない
const markerInput = $('markerSize');
markerInput.value = st.markerSize;
markerInput.addEventListener('input', () => {
  const v = parseFloat(markerInput.value);
  if (Number.isFinite(v) && v >= 1 && v <= 100) { st.markerSize = v; save(); }
});
markerInput.addEventListener('blur', () => { markerInput.value = st.markerSize; });
// マーカー補正を入れたら、この値(m)を使う
const markerSizeM = () => st.markerSize / 100;

// ------------------------------------------------------------
// WebXR セッション
// ------------------------------------------------------------
const camPos = new THREE.Vector3();
const camQuat = new THREE.Quaternion();
let poseOK = false;
let emulated = false;
let aPos = null;
let visCount = 0;
let hudLast = 0;

(async function checkSupport() {
  const el = $('support');
  const ua = navigator.userAgent || '';
  if (!('xr' in navigator)) {
    const ios = /iPhone|iPad|iPod/.test(ua);
    el.className = 'warn';
    el.textContent = ios
      ? 'iPhone/iPadのSafariはWebXRに対応していません。従来のindex.htmlを使ってください。'
      : 'このブラウザはWebXRに対応していません。AndroidのChromeで、HTTPSのURLから開いてください。';
    return;
  }
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    if (ok) {
      el.className = 'ok';
      el.textContent = 'この端末はWebXR ARに対応しています。';
      $('btnAR').disabled = false;
    } else {
      el.className = 'warn';
      el.textContent = 'この端末ではWebXR ARが使えません(ARCore対応のAndroid + Chromeが必要です)。';
    }
  } catch (e) {
    el.className = 'warn';
    el.textContent = '対応の確認に失敗しました: ' + e.message;
  }
})();

$('btnAR').addEventListener('click', async () => {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: overlay }
    });
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
  } catch (e) {
    $('support').className = 'warn';
    $('support').textContent = 'ARを開始できませんでした: ' + (e && e.message ? e.message : e);
  }
});

renderer.xr.addEventListener('sessionstart', () => {
  overlay.classList.add('in-ar');
  $('settings').classList.remove('open');
  start = null;
  aPos = null;
  poseOK = false;
  layout();
  renderer.setAnimationLoop(onFrame);
});
renderer.xr.addEventListener('sessionend', () => {
  renderer.setAnimationLoop(null);
  overlay.classList.remove('in-ar');
});

$('btnEnd').onclick = () => { const s = renderer.xr.getSession(); if (s) s.end(); };
$('btnSettings').onclick = () => $('settings').classList.toggle('open');

$('btnStart').onclick = () => {
  if (!poseOK) { setStatus('トラッキングできていません。少しスマホを動かして、床や壁を映してください。'); return; }
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camQuat);
  f.y = 0;
  if (f.lengthSq() < 0.01) { setStatus('上や下を向きすぎです。進む方向の正面を向いてもう一度押してください。'); return; }
  f.normalize();
  const right = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
  start = { p0: camPos.clone(), fwd: f, right };
  layout();
};
$('btnMarkA').onclick = () => {
  if (!poseOK) { setStatus('トラッキングできていません。'); return; }
  aPos = camPos.clone();
};
$('btnClearA').onclick = () => { aPos = null; };

function setStatus(html) { $('status').innerHTML = html; }

function onFrame(time, frame) {
  if (frame) {
    const ref = renderer.xr.getReferenceSpace();
    const pose = ref ? frame.getViewerPose(ref) : null;
    if (pose) {
      const p = pose.transform.position, o = pose.transform.orientation;
      camPos.set(p.x, p.y, p.z);
      camQuat.set(o.x, o.y, o.z, o.w);
      poseOK = true;
      emulated = !!pose.emulatedPosition;
    } else {
      poseOK = false;
    }
  }

  // 近づくとフェードイン(水平距離で判定)
  visCount = 0;
  if (poseOK && start) {
    for (const p of panels) {
      const dx = p.mesh.position.x - camPos.x;
      const dz = p.mesh.position.z - camPos.z;
      const d = Math.hypot(dx, dz);
      const o = THREE.MathUtils.clamp((st.trigger - d) / 0.8, 0, 1);
      p.mesh.material.opacity = o;
      p.mesh.visible = o > 0.01;
      if (p.mesh.visible) visCount++;
    }
  }

  // 画面表示は5回/秒くらいに間引く
  if (time - hudLast > 200) {
    hudLast = time;
    updateHud();
  }
  renderer.render(scene, camera);
}

function updateHud() {
  const lines = [];
  lines.push('トラッキング: ' + (poseOK ? (emulated ? '<span class="warn">位置なし(推定中)</span>' : '<span class="ok">OK</span>') : '<span class="warn">喪失</span>'));
  if (!start) {
    lines.push('<span class="warn">スタート地点が未設定です。進む方向を向いて、下のボタンを押してください。</span>');
  } else if (poseOK) {
    const d = camPos.clone().sub(start.p0);
    const s = d.dot(start.fwd);
    const l = d.dot(start.right);
    lines.push('前進 ' + s.toFixed(2) + ' m / 横 ' + l.toFixed(2) + ' m / 表示中 ' + visCount + '/' + panels.length);
  }
  if (aPos && poseOK) {
    const h = Math.hypot(camPos.x - aPos.x, camPos.z - aPos.z) * 100;
    const v = (camPos.y - aPos.y) * 100;
    lines.push('A地点との差: 水平 ' + h.toFixed(0) + ' cm / 高さ ' + v.toFixed(0) + ' cm');
  }
  setStatus(lines.join('<br>'));
}

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

buildPanels();
</script>
</body>
</html>
